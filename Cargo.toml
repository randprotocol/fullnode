[workspace]
resolver = "2"
members = ["crates/randprotocol-core", "crates/randprotocol-zkvm", "crates/randprotocol-client", "crates/randprotocol-node", "crates/randprotocol-prover", "crates/bridge-codec", "crates/randprotocol-rvm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["RandProtocol Contributors"]

[workspace.dependencies]
randprotocol-core = { path = "crates/randprotocol-core" }
randprotocol-client = { path = "crates/randprotocol-client" }
randprotocol-zkvm = { path = "crates/randprotocol-zkvm" }
randprotocol-rvm = { path = "crates/randprotocol-rvm" }
randprotocol-prover = { path = "crates/randprotocol-prover" }
bridge-codec = { path = "crates/bridge-codec" }

# crypto
crystals-dilithium = "2.0"
blake3 = "1.8"
bs58 = "0.5"
rand = "0.8"
zeroize = "1"
k256 = { version = "0.13", features = ["ecdsa"] }
sha3 = "0.10"

# serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
hex = "0.4"

# errors / logging
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# async / net
tokio = { version = "1.35", features = ["full"] }
futures = "0.3"
libp2p = { version = "0.57", features = ["tokio", "tcp", "noise", "yamux", "gossipsub", "mdns", "identify", "kad", "request-response", "cbor", "ping", "macros"] }
# The sync request-response codec is ours rather than libp2p's `cbor::Behaviour`, because that one
# hard-codes its size limits (see `network::codec`). Same serializer, same versions libp2p pins.
cbor4ii = { version = "0.3.2", features = ["serde1", "use_std"] }
async-trait = "0.1"
axum = { version = "0.7", features = ["ws"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }

# storage
rocksdb = { version = "0.22", default-features = false, features = ["lz4"] }

# cli
clap = { version = "4.4", features = ["derive", "env"] }

# test
tempfile = "3.10"
# The WebSocket *client* the `ws` integration test drives. axum's own `ws` feature brings a
# tungstenite of its own for the server side; this is the other end of the wire, and a test-only
# dependency for that reason.
tokio-tungstenite = "0.24"

[profile.release]
opt-level = 3

[profile.dev.package."*"]
opt-level = 2

# The zkVM prover runs in dev/test builds (the cluster tests prove real bundles). At the
# default dev opt-level 0 a single bundle proof took 575 s; `"*"` above covers dependencies
# only, never a workspace member, so this member needs its own entry.
[profile.dev.package.randprotocol-zkvm]
opt-level = 2

# The recursion VM's prover runs in dev/test builds too (the aggregation cluster tests prove
# real rVM aggregates): the same member-level entry as the zkVM's, and for the same reason.
[profile.dev.package.randprotocol-rvm]
opt-level = 2
