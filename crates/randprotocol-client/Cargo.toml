[package]
name = "randprotocol-client"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "RAND wallet client: JSON-RPC client library and the `rand` command-line wallet"

[[bin]]
name = "rand"
path = "src/main.rs"

[dependencies]
randprotocol-core = { workspace = true }
randprotocol-zkvm = { workspace = true }
# The delegated-proving wire (sealed job, sealed reply, pairing link) — never the service half.
randprotocol-prover = { workspace = true, default-features = false }
reqwest = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
# The prover job's token and reply key are wiped after use (`prover.rs`).
zeroize = { workspace = true }
clap = { workspace = true }
# `rand address --qr`/`--qr-png` and `rand contacts show --qr` (spec 2026-09-26 §2.2).
qrcode = { version = "0.14", default-features = false, features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[features]
default = []
# `rand call --cuda` proves on an attached NVIDIA GPU. Needs a CUDA 13 toolkit at build time
# and the sibling `circuits` checkout for the backend crate.
cuda = ["randprotocol-zkvm/cuda"]
# The same `--cuda` path with the kernels running on the host mock driver: no GPU, no toolkit.
mock-cuda = ["randprotocol-zkvm/mock-cuda"]

[dev-dependencies]
tempfile = { workspace = true }
# `tests/wallet_flow.rs` drives a real one-node chain in-process. Cargo allows this cycle
# because it goes through dev-dependencies only: `randprotocol-node` depends on this crate for its
# own binary, and nothing in this crate's library depends on the node.
randprotocol-node = { path = "../randprotocol-node" }
libp2p = { workspace = true }
tracing-subscriber = { workspace = true }
# `tests/wallet_flow.rs` runs a real prover service beside the node (the delegated-proving end to end).
randprotocol-prover = { workspace = true, features = ["service"] }
