[package]
name = "randprotocol-node"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "RAND full node: storage, p2p networking, sync, JSON-RPC, CLI"

[[bin]]
name = "rand-node"
path = "src/main.rs"

[dependencies]
randprotocol-core = { workspace = true }
randprotocol-client = { workspace = true }
randprotocol-zkvm = { workspace = true }
randprotocol-rvm = { workspace = true }
p3-field = "=0.7.0"
postcard = { version = "1", features = ["alloc"] }
blake3 = { workspace = true }
bs58 = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bincode = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
libp2p = { workspace = true }
cbor4ii = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
reqwest = { workspace = true }
rocksdb = { workspace = true }
clap = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio-tungstenite = { workspace = true }
randprotocol-rvm = { workspace = true }
p3-field = "=0.7.0" 
