[package]
name = "randprotocol-prover"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "RandProtocol delegated prover: the sealed job wire, the pairing store and the rand-prover service"

[features]
default = ["service"]
# The listener, the queue, the CLI. Off for a wasm wallet core that only needs the wire codec.
service = ["dep:axum", "dep:tokio", "dep:sysinfo", "dep:tracing", "dep:tracing-subscriber", "dep:clap", "dep:anyhow", "dep:qrcode", "parallel"]
# Plonky3's own `parallel` feature (rayon), switched on for the whole build through this one
# dependency: the STARK prover then uses every core instead of one. Measured on an 8-vCPU
# DigitalOcean c2 droplet (Xeon 8168), one production tier-14 bundle proof: 234.4 s without it,
# 68.6 s with it, peak RSS 5.88 GB against 5.74 GB; the proof verifies and commits the same. It
# comes with `service` because a prover has a deadline (a bundle lands within
# `ledger::TIME_WINDOW` blocks or not at all) and never builds for wasm, where rayon does not.
parallel = ["dep:p3-maybe-rayon"]
cuda = ["randprotocol-zkvm/cuda"]
mock-cuda = ["randprotocol-zkvm/mock-cuda"]

[dependencies]
randprotocol-core = { workspace = true }
randprotocol-zkvm = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
postcard = { version = "1", features = ["alloc"] }
hex = { workspace = true }
bs58 = { workspace = true }
blake3 = { workspace = true }
zeroize = { workspace = true, features = ["derive"] }
# HCS-1's pins, verbatim from crates/randprotocol-zkvm/Cargo.toml: a job sealed by a wallet must
# open on a prover, and both sides are this one implementation.
ml-kem = "=0.3.2"
chacha20poly1305 = { version = "=0.11.0", features = ["zeroize"] }
rand = { version = "=0.10.2", features = ["std_rng"] }
rand_core = "=0.10.1"
# Named only for its feature (see `parallel` above); the version is the zkvm crate's Plonky3 pin.
p3-maybe-rayon = { version = "=0.7.0", features = ["parallel"], optional = true }
# StdRng's stream is ChaCha12 from `chacha20` (HCS-1's third pin, as in the zkvm crate); named only for the pin.
chacha20 = { version = "=0.10.2", default-features = false }
axum = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
sysinfo = { version = "0.33", optional = true, default-features = false, features = ["system"] }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
qrcode = { version = "0.14", default-features = false, optional = true }

[dev-dependencies]
tokio = { workspace = true }
reqwest = { workspace = true }
tempfile = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt"] }

[[test]]
name = "service"
required-features = ["service"]

[[test]]
name = "http"
required-features = ["service"]

[[test]]
name = "hygiene"
required-features = ["service"]

[[bin]]
name = "rand-prover"
path = "src/main.rs"
required-features = ["service"]
