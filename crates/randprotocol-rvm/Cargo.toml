[package]
name = "randprotocol-rvm"
version = "0.1.0"
edition = "2021"
description = "Rand recursion VM (rVM): a field-native machine whose programs verify Rand zkVM proofs"
license.workspace = true

[lib]
name = "randprotocol_rvm"
path = "src/lib.rs"

[dependencies]
# Exactly research's pins; the rVM shares the field, the permutation and the proof system.
p3-goldilocks = "=0.7.0"
p3-field = "=0.7.0"
p3-symmetric = "=0.7.0"
p3-challenger = "=0.7.0"
p3-poseidon2 = "=0.7.0"
p3-air = "=0.7.0"
p3-batch-stark = "=0.7.0"
p3-lookup = "=0.7.0"
p3-uni-stark = "=0.7.0"
p3-fri = "=0.7.0"
p3-dft = "=0.7.0"
p3-merkle-tree = "=0.7.0"
p3-commit = "=0.7.0"
p3-matrix = "=0.7.0"
p3-util = "=0.7.0"
# HCS-1 (2026-09-27 zkVM review): exact pins, not carets. Through constraint set 6 every verifier
# key's preprocessed commitment was salted from `StdRng::seed_from_u64(KEY_SEED)` (here and in
# `research/`), a stream `rand` does not promise to keep. Constraint set 7 salts every key from
# `research`'s `key_derivation_v2` (this crate from its own labels, `machine::KEY_MMCS_LABEL`), so no
# key depends on `rand`; it only seeds proving's salts from OS entropy. The pins stay — they cost
# nothing. `tests/verifier_key.rs` (here and in `research/`) pins the keys themselves.
rand = { version = "=0.10.2", features = ["std_rng"] }
rand_core = "=0.10.1"
chacha20 = { version = "=0.10.2", default-features = false }
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["alloc"] }
# The reference verifier this crate's first program mirrors, the reference permutation it hashes
# with, the Chip AIRs its constraint emitter walks, and the bundle guest its fixtures prove.
randprotocol-zkvm = { path = "../randprotocol-zkvm" }
# The GPU (CUDA) and CPU-twin NTT/Poseidon2-Merkle engines the proving backends run on —
# research's dependency, consumed as-is (M5.4 R1: the rVM's shapes need no new kernels).
rand-zkvm-cuda = { git = "https://github.com/randprotocol/zkp-circuits", rev = "75b78938c5b81851cad3fe2d21de1f8378360bc1", optional = true }
# The `parallel` feature's rayon: Plonky3's maybe-rayon shim (its `parallel` feature turns rayon on in
# every p3 crate that uses it) and rayon itself, for `RAYON_NUM_THREADS`'s pool.
p3-maybe-rayon = { version = "=0.7.0", optional = true }
rayon = { version = "1", optional = true }

[dev-dependencies]
hex = "0.4"
# `tests/memprofile.rs`: a span-boundary heap logger over Plonky3's own `tracing` spans (the
# version is the one the p3 crates already lock).
tracing = "0.1"

[features]
# `rand-zkvm-cuda`'s CPU-twin engines (the reference backend). Research's feature, mirrored.
reference-backend = ["dep:rand-zkvm-cuda"]
# `cuda` and `mock-cuda` are mutually exclusive: enabling both is a hard `compile_error!` in
# rand-zkvm-cuda, so the host mock can never be silently substituted for the GPU.
# `Backend::Cuda` against a real device. Pulls `cuda-core`, which needs a CUDA 13 toolkit
# (`rand-zkvm-cuda/ptx/PTX_BUILD.md`): a fleet-GPU-node build, never this box's.
cuda = ["dep:rand-zkvm-cuda", "rand-zkvm-cuda/cuda"]
# Deliberately *not* `["cuda", ...]` — `rand-zkvm-cuda/cuda` is what pulls `cuda-core`, so
# enabling it would put a CUDA toolkit back in the way of a no-GPU test run. The two features
# exercise the identical `Backend::Cuda` path.
mock-cuda = ["dep:rand-zkvm-cuda", "rand-zkvm-cuda/mock-driver"]
# Plonky3's own `parallel` feature (rayon) for the prover, off by default: the proofs it makes are
# the same proofs (same config, transcript and FRI parameters — `docs/03`'s retype discipline),
# made on every core. Needs the two patched crates under `../vendor/` (hiding RNG lock forked,
# never held across rayon work — upstream Plonky3 #2363; the fullnode's patch, copied verbatim).
parallel = ["dep:p3-maybe-rayon", "p3-maybe-rayon/parallel", "dep:rayon"]
