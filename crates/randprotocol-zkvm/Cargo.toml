[package]
name = "randprotocol-zkvm"
version.workspace = true
edition = "2021"
license.workspace = true
authors.workspace = true
description = "Rand zkVM (RV32I under a Plonky3 batch STARK, Goldilocks) plus the RAND chain executor"

[lib]
name = "randprotocol_zkvm"
path = "src/lib.rs"

[[bin]]
name = "randprotocol-zkvm-demo"
path = "src/main.rs"

[dependencies]
randprotocol-core = { workspace = true }
p3-air = "=0.7.0"
p3-uni-stark = "=0.7.0"
p3-batch-stark = "=0.7.0"
p3-lookup = "=0.7.0"
p3-goldilocks = "=0.7.0"
# M3.2: the `poseidon2` table (`tables/poseidon2.rs`) reproduces the round-constant RNG draw
# `p3_poseidon2::Poseidon2Goldilocks`'s own construction makes, so its preprocessed trace is
# byte-identical to `machine::permutation()`'s hashing permutation — see that table's module doc
# comment. Not needed by the excluded note/viewing-key stack; this is a core dependency now.
p3-poseidon2 = "=0.7.0"
p3-field = "=0.7.0"
p3-matrix = "=0.7.0"
p3-challenger = "=0.7.0"
p3-commit = "=0.7.0"
p3-fri = "=0.7.0"
p3-dft = "=0.7.0"
p3-merkle-tree = "=0.7.0"
p3-symmetric = "=0.7.0"
# M4.2: the `keccak` table (`tables/keccak.rs`) is built on `p3_keccak::KeccakAir`, and
# `tests/keccak.rs` cross-checks `src/keccak.rs`'s host permutation against `p3_keccak`'s own.
# Pinned to the exact version upstream uses — see `deploy/sync-zkvm.sh`'s header.
p3-keccak = "=0.7.0"
# HCS-1 (2026-09-27 zkVM review): verifier keys are derived from StdRng's output stream (KEY_SEED);
# exact pins so no dependency bump can silently move every key. tests/verifier_key.rs pins them.
rand = { version = "=0.10.2", features = ["std_rng"] }
rand_core = "=0.10.1"
# StdRng's stream is ChaCha12 from `chacha20` (HCS-1's third pin, upstream's `=0.10.2` since
# circuits `7a75ae2`): a `chacha20` release that moved the stream would move every key as surely
# as a `rand` one. Named here only for the pin — nothing in this crate calls it directly.
chacha20 = { version = "=0.10.2", default-features = false }
# Shielded pool S1: the vendored note layer's envelope format (`src/viewing.rs`). Pinned to the
# exact versions the research crate uses — an envelope sealed by a wallet must open on a node,
# and both sides are this one implementation.
ml-kem = "=0.3.2"
chacha20poly1305 = "=0.11.0"
serde = { workspace = true }
serde_json = { workspace = true }
postcard = { version = "1", features = ["alloc"] }
# The GPU backend is circuits' `rand-zkvm-cuda`, taken from the public zkp-circuits repository at
# a pinned revision — a git dependency, not a path to a sibling checkout (audit v6 PROC-2, issue
# #109: cargo loads every path dependency's manifest, optional or not, so a sibling path made a
# clone of this repository alone fail at `cargo metadata`). It is never vendored. Optional, off
# by default, and still resolved: cargo fetches the repository (a few MB) to read this manifest
# and record the revision in Cargo.lock, so a first build needs the network for it like for
# crates.io. The revision is the one `deploy/sync-zkvm.sh` writes into
# `crates/randprotocol-rvm/Cargo.toml` (the same package must come from the same source in both,
# or cargo sees two crates); CI's `guest-provenance` job checks that `rand-zkvm-cuda/` and the
# `research/src/poseidon2_constants.rs` it `#[path]`-includes are identical between this
# revision and `CIRCUITS_PIN`, which may be ahead of it when the pin moved for a change outside
# the backend. It must be a commit reachable from the public repository.
rand-zkvm-cuda = { git = "https://github.com/randprotocol/zkp-circuits", rev = "5f69747487c9826af8a4c164d786f420597b375f", optional = true }
# M4.3/M4.4 (arrived with the constraint-set-6 re-vendor): the EVM and sBPF interpreter cores —
# no_std libraries with no dependencies, compiled into the `evm`/`sbpf` guests on riscv32im and
# run natively here. Normal dependencies, not dev-dependencies, because `src/evm.rs`/`src/sbpf.rs`
# (the host sides: `HostRef`, the storage tree, the aligned serializer) are part of this library
# — the vendored `tests/{evm,sbpf}_*.rs` link `randprotocol_zkvm` as an external crate. Vendored
# copies of circuits' `guests-compiled/{evm-core,sbpf-core}` at `CIRCUITS_PIN`, made by
# `deploy/sync-zkvm.sh` and pinned by `vendor/circuits/PROVENANCE.md` and
# `tests/guest_provenance.rs` (PROC-2, #109; they were sibling path dependencies before).
evm-core = { path = "../../vendor/circuits/evm-core" }
sbpf-core = { path = "../../vendor/circuits/sbpf-core" }

[dev-dependencies]
# The same `evm-core` with its `ffi` feature, for tests only (upstream's dev-dependency, taken with
# constraint set 7's re-vendor): `tests/evm_abi.rs` drives the C ABI (`evm_sload`/`evm_sstore`/
# `evm_keccak256`) `evm2rv`'s translated contracts call.
evm-core = { path = "../../vendor/circuits/evm-core", features = ["ffi"] }
# M4.2: the vendored `tests/keccak.rs` states its known-answer vectors as hex strings. Same
# version upstream's `[dev-dependencies]` pins.
hex = "0.4"
# M4.3/M4.4 (constraint-set-6 re-vendor), all at upstream's exact pins, host tests only, never
# in a guest: `num-bigint` is the oracle for `evm-core`'s 256-bit arithmetic; `revm` (bare
# interpreter, default-features off so the precompile crates' C dependencies stay out) the
# oracle for its opcode semantics and gas; `sha2` (`compress`) the oracle for the SHA-256 chip
# and `src/sha256.rs`; `solana-sbpf` (default-features off — its default `jit` is x86_64-only
# and irrelevant) the differential oracle for `sbpf-core`'s interpreter and ELF loader, in
# `tests/common/sbpf_oracle.rs`.
num-bigint = "0.4"
revm = { version = "=43.0.2", default-features = false, features = ["std"] }
sha2 = { version = "=0.10.9", features = ["compress"] }
solana-sbpf = { version = "=0.11.1", default-features = false }

[features]
default = []
# The GPU backend's CPU-twin engines: the same Merkle/NTT code paths, no device needed.
reference-backend = ["dep:rand-zkvm-cuda"]
# `cuda` and `mock-cuda` are mutually exclusive: enabling both is a hard `compile_error!` in
# rand-zkvm-cuda, so the host mock can never be silently substituted for the GPU.
# `Backend::Cuda` against a real device. Pulls `cuda-core`, which needs a CUDA 13 toolkit at
# build time.
cuda = ["dep:rand-zkvm-cuda", "rand-zkvm-cuda/cuda"]
# `Backend::Cuda` end to end on the mock driver: the same kernel bodies run on the host.
# Deliberately *not* `["cuda", ...]` — `rand-zkvm-cuda/cuda` is what pulls `cuda-core`, so
# enabling it would put a CUDA toolkit back in the way of a no-GPU test run. The two features
# are siblings; either one turns on `Backend::Cuda`.
mock-cuda = ["dep:rand-zkvm-cuda", "rand-zkvm-cuda/mock-driver"]
