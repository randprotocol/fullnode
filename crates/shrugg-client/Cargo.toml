[package]
name = "shrugg-client"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "SHRUGG wallet client: JSON-RPC client library and the `shrugg` command-line wallet"

[[bin]]
name = "shrugg"
path = "src/main.rs"

[dependencies]
shrugg-core = { workspace = true }
shrugg-zkvm = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }

[features]
default = []
# `shrugg call --cuda` proves on an attached NVIDIA GPU. Needs a CUDA 13 toolkit at build time
# and the sibling `circuits` checkout for the backend crate.
cuda = ["shrugg-zkvm/cuda"]
# The same `--cuda` path with the kernels running on the host mock driver: no GPU, no toolkit.
mock-cuda = ["shrugg-zkvm/mock-cuda"]

[dev-dependencies]
tempfile = { workspace = true }
