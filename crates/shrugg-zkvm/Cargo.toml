[package]
name = "shrugg-zkvm"
version.workspace = true
edition = "2021"
license.workspace = true
authors.workspace = true
description = "Rand zkVM (RV32I under a Plonky3 batch STARK, Goldilocks) plus the SHRUGG chain executor"

[lib]
name = "shrugg_zkvm"
path = "src/lib.rs"

[[bin]]
name = "shrugg-zkvm-demo"
path = "src/main.rs"

[dependencies]
shrugg-core = { workspace = true }
p3-air = "=0.7.0"
p3-uni-stark = "=0.7.0"
p3-batch-stark = "=0.7.0"
p3-lookup = "=0.7.0"
p3-goldilocks = "=0.7.0"
# M3.2: the `poseidon2` table (`tables/poseidon2.rs`) reproduces the round-constant RNG draw
# `p3_poseidon2::Poseidon2Goldilocks`'s own construction makes, so its preprocessed trace is
# byte-identical to `machine::permutation()`'s hashing permutation — see that table's module doc
# comment. Not needed by the excluded note/viewing-key stack; this is a core dependency now.
p3-poseidon2 = "=0.7.0"
p3-field = "=0.7.0"
p3-matrix = "=0.7.0"
p3-challenger = "=0.7.0"
p3-commit = "=0.7.0"
p3-fri = "=0.7.0"
p3-dft = "=0.7.0"
p3-merkle-tree = "=0.7.0"
p3-symmetric = "=0.7.0"
# M4.2: the `keccak` table (`tables/keccak.rs`) is built on `p3_keccak::KeccakAir`, and
# `tests/keccak.rs` cross-checks `src/keccak.rs`'s host permutation against `p3_keccak`'s own.
# Pinned to the exact version upstream uses — see `deploy/sync-zkvm.sh`'s header.
p3-keccak = "=0.7.0"
rand = { version = "0.10", features = ["std_rng"] }
# Shielded pool S1: the vendored note layer's envelope format (`src/viewing.rs`). Pinned to the
# exact versions the research crate uses — an envelope sealed by a wallet must open on a node,
# and both sides are this one implementation.
ml-kem = "=0.3.2"
chacha20poly1305 = "=0.11.0"
serde = { workspace = true }
serde_json = { workspace = true }
postcard = { version = "1", features = ["alloc"] }
# The GPU backend lives in the sibling `circuits` checkout and is referenced by path, never
# vendored: `circuits/` must sit beside `fullnode/` to build any of the features below.
rand-zkvm-cuda = { path = "../../../circuits/rand-zkvm-cuda", optional = true }
# M4.3/M4.4 (arrived with the constraint-set-6 re-vendor): the EVM and sBPF interpreter cores —
# no_std libraries with their own workspace roots, compiled into the `evm`/`sbpf` guests on
# riscv32im and run natively here. Normal dependencies, not dev-dependencies, because
# `src/evm.rs`/`src/sbpf.rs` (the host sides: `HostRef`, the storage tree, the aligned
# serializer) are part of this library — the vendored `tests/{evm,sbpf}_*.rs` link
# `shrugg_zkvm` as an external crate. Same sibling-checkout rule as `rand-zkvm-cuda` above,
# but NOT optional: `circuits/` must sit beside `fullnode/` for any build of this crate.
evm-core = { path = "../../../circuits/guests-compiled/evm-core" }
sbpf-core = { path = "../../../circuits/guests-compiled/sbpf-core" }

[dev-dependencies]
# M4.2: the vendored `tests/keccak.rs` states its known-answer vectors as hex strings. Same
# version upstream's `[dev-dependencies]` pins.
hex = "0.4"
# M4.3/M4.4 (constraint-set-6 re-vendor), all at upstream's exact pins, host tests only, never
# in a guest: `num-bigint` is the oracle for `evm-core`'s 256-bit arithmetic; `revm` (bare
# interpreter, default-features off so the precompile crates' C dependencies stay out) the
# oracle for its opcode semantics and gas; `sha2` (`compress`) the oracle for the SHA-256 chip
# and `src/sha256.rs`; `solana-sbpf` (default-features off — its default `jit` is x86_64-only
# and irrelevant) the differential oracle for `sbpf-core`'s interpreter and ELF loader, in
# `tests/common/sbpf_oracle.rs`.
num-bigint = "0.4"
revm = { version = "=43.0.2", default-features = false, features = ["std"] }
sha2 = { version = "=0.10.9", features = ["compress"] }
solana-sbpf = { version = "=0.11.1", default-features = false }

[features]
default = []
# The GPU backend's CPU-twin engines: the same Merkle/NTT code paths, no device needed.
reference-backend = ["dep:rand-zkvm-cuda"]
# `cuda` and `mock-cuda` are mutually exclusive: enabling both is a hard `compile_error!` in
# rand-zkvm-cuda, so the host mock can never be silently substituted for the GPU.
# `Backend::Cuda` against a real device. Pulls `cuda-core`, which needs a CUDA 13 toolkit at
# build time.
cuda = ["dep:rand-zkvm-cuda", "rand-zkvm-cuda/cuda"]
# `Backend::Cuda` end to end on the mock driver: the same kernel bodies run on the host.
# Deliberately *not* `["cuda", ...]` — `rand-zkvm-cuda/cuda` is what pulls `cuda-core`, so
# enabling it would put a CUDA toolkit back in the way of a no-GPU test run. The two features
# are siblings; either one turns on `Backend::Cuda`.
mock-cuda = ["dep:rand-zkvm-cuda", "rand-zkvm-cuda/mock-driver"]
