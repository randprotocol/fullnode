# prover.randprotocol.org: the pool of validator-hosted delegated provers, behind one name.
# nginx terminates TLS and meters each client; deploy/prover/router.py (127.0.0.1:8650) sends
# each job to a prover with a free slot. Jobs and replies are sealed end to end, so nothing here
# can read a witness or a proof. No access log: which address asked for a proof when is not
# something this host keeps.
#
# The zone belongs in the http context: /etc/nginx/conf.d/prover.conf holds
#   limit_req_zone $binary_remote_addr zone=prover:2m rate=240r/m;
# A wallet polls prover_status once a second per job and may run two jobs; 240 a minute with a
# burst of 60 covers that and nothing like a flood.
server {
    listen 80;
    listen [::]:80;
    server_name prover.randprotocol.org;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name prover.randprotocol.org;

    ssl_certificate     /etc/letsencrypt/live/prover.randprotocol.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prover.randprotocol.org/privkey.pem;

    access_log off;

    # What a client needs to pair: the pool's pairing link, URL and key fingerprint. Public by
    # design — the token in it is every wallet's — so any origin may read it.
    location = /.well-known/rand-prover.json {
        root /var/www/prover;
        default_type application/json;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=300" always;
    }

    location = / {
        limit_req zone=prover burst=60 nodelay;
        limit_req_status 429;
        # http.rs MAX_BODY_BYTES (135 168) rounded up; the router refuses above the exact figure.
        client_max_body_size 140k;

        proxy_pass http://127.0.0.1:8650;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
    }

    location / { return 404; }
}
