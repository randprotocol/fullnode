# rand-node's public RPC listener, for a host that serves public RPC traffic (VK-2, monorepo#17).
#
# Install as /etc/systemd/system/rand-node.service.d/60-public-rpc.conf (deploy/enable-public-rpc.sh
# does), then `systemctl daemon-reload && systemctl restart rand-node`, one host at a time, and run
# deploy/check-public-rpc.sh. It leaves ExecStart alone: the node reads the address from the
# environment, exactly as if `--public-rpc 127.0.0.1:8546` were on its command line.
#
# Needs rand-node v0.8.7 or later (`rand-node run --help` lists RAND_NODE_PUBLIC_RPC). An older
# binary ignores the variable and opens no listener; deploy/enable-public-rpc.sh edits ExecStart
# on such a host instead, and deploy/check-public-rpc.sh fails either way if the listener is not up.
#
# The listener serves rpc::PUBLIC_METHODS only: no viewing-key methods, no rand_mint, no
# rand_getPeers, no batches, no WebSocket, one meter for every caller. Point the reverse proxy or
# the SSH forward at 127.0.0.1:8546, never at --rpc (8545), which treats loopback as the operator.
[Service]
Environment=RAND_NODE_PUBLIC_RPC=127.0.0.1:8546
